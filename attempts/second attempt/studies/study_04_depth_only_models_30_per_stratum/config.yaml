study_name: study_04_depth_only_models_30_per_stratum
dataset_root: C:\Users\depthlev\Desktop\droneImages\dataset
strict: true

depth_model:
  model_name: depth-anything/Depth-Anything-V2-Small-hf
  device: null
  local_files_only: true

study:
  sample_count_per_stratum: 30
  sample_seed: 20260503
  progress_log_every_samples: 10
  progress_log_every_contexts: 1
  progress_log_every_single_features: 10
  inner_bbox_scale: 0.5
  surrounding_bbox_scale: 1.8
  context_windows:
    - name: full_image
      scale: null
    - name: bbox_expand_16x
      scale: 16.0
    - name: bbox_expand_10x
      scale: 10.0
    - name: bbox_expand_8x
      scale: 8.0
    - name: bbox_expand_6x
      scale: 6.0
    - name: bbox_expand_4x
      scale: 4.0
    - name: bbox_expand_2x
      scale: 2.0
    - name: bbox_expand_1_5x
      scale: 1.5
    - name: bbox_only
      scale: 1.0
  aggregation_methods:
    - inner50_median
    - bbox_mean
    - bbox_midpoint
  score_fields:
    - object_depth
    - object_depth_percentile_5_95
    - object_minus_ring
    - object_minus_ring_normalized

depth_only_modeling:
  enabled: true
  goal: find the strongest depth-only combination before building the final stacked model
  num_folds: 5
  cv_seed: 20260505
  bootstrap_iterations: 1000
  bootstrap_seed: 20260506
  top_pool_size: 24
  greedy_forward_max_features: 8
  single_feature_metrics:
    primary_metric: cv_mae
    tie_breakers:
      - cv_mean_relative_error
      - spearman_correlation
      - method_id
  tree_models:
    enabled: true
    random_state: 20260505
    top_feature_pool_sizes:
      - 12
      - 24
    random_forest:
      n_estimators: 300
      max_depth: null
      min_samples_leaf: 2
      max_features: sqrt
    extra_trees:
      n_estimators: 400
      max_depth: null
      min_samples_leaf: 2
      max_features: sqrt
    gradient_boosting:
      n_estimators: 250
      learning_rate: 0.05
      max_depth: 3
      min_samples_leaf: 2
      subsample: 0.8
    xgboost:
      n_estimators: 300
      learning_rate: 0.05
      max_depth: 4
      min_child_weight: 2.0
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 1.0

existing_feature_sources:
  representation_records_csvs:
    - attempts/second attempt/studies/study_03_multiscale_fusion/artifacts/features/representation_records.csv
    - attempts/second attempt/studies/study_02_expanded_10_per_stratum/artifacts/features/representation_records.csv

output_root: attempts/second attempt/studies/study_04_depth_only_models_30_per_stratum/artifacts
