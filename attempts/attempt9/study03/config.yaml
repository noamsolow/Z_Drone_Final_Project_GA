study_name: attempt9_study03_depth_pro_noisy_aggregated_features
dataset_root: C:\Users\depthlev\Desktop\droneImages\dataset
strict: true
max_samples: null

sources:
  source_aggregated_features_csv: attempts/attempt3/studies/study03/artifacts/features/noisy_aggregated_feature_table.csv

depth_model:
  kind: depth_pro
  checkpoint_path: checkpoints/depth_pro.pt
  device: cuda

study:
  progress_log_every_rows: 25
  resume_from_partial: true
  stop_on_missing_source: false
  excluded_path_fragments:
    - depth_20/clear_sky/10AM
    - depth_20/light_rain/10AM
    - depth_30/clear_sky/10AM
    - depth_30/light_rain/10AM
  inner_bbox_scale: 0.5
  surrounding_bbox_scale: 1.8
  context_windows:
    - name: bbox_expand_4x
      scale: 4.0
    - name: bbox_expand_2x
      scale: 2.0
    - name: bbox_expand_1_5x
      scale: 1.5
    - name: bbox_only
      scale: 1.0
  aggregation_methods:
    - bbox_midpoint
    - bbox_mean
    - inner50_median
  jitter_boxes:
    - name: original
      dx_frac: 0.0
      dy_frac: 0.0
      scale: 1.0
    - name: shift_left
      dx_frac: -0.08
      dy_frac: 0.0
      scale: 1.0
    - name: shift_right
      dx_frac: 0.08
      dy_frac: 0.0
      scale: 1.0
    - name: shift_up
      dx_frac: 0.0
      dy_frac: -0.08
      scale: 1.0
    - name: shift_down
      dx_frac: 0.0
      dy_frac: 0.08
      scale: 1.0
    - name: scale_down
      dx_frac: 0.0
      dy_frac: 0.0
      scale: 0.92
    - name: scale_up
      dx_frac: 0.0
      dy_frac: 0.0
      scale: 1.08

output_root: attempts/attempt9/study03/artifacts
