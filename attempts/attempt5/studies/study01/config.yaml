study_name: study01_export_rf_xgb_ensemble

sources:
  feature_table_csv: attempts/attempt4/studies/study01/artifacts/features/noisy_expanded_feature_table.csv
  split_json: attempts/attempt4/studies/study01/artifacts/splits/test_split.json
  attempt4_rf_config_yaml: attempts/attempt4/studies/study01/config.yaml
  attempt4_xgb_config_yaml: attempts/attempt4/studies/study02/config.yaml

model:
  model_name: raw_depth_geometry_metadata_ensemble
  raw_depth_feature_name: bbox_only__inner50_median__object_depth
  categorical_feature_names:
    - weather
    - time_of_day
  rf:
    source_model_name: raw_depth_geometry_metadata_rf
    candidate_name: rf_unbounded
  xgb:
    source_model_name: raw_depth_geometry_metadata_xgb
    candidate_name: xgb_deep
  blend:
    tuned:
      rf_weight: 0.44
      xgb_weight: 0.56
    equal:
      rf_weight: 0.50
      xgb_weight: 0.50

export:
  scopes:
    - dev_holdout
    - full_dataset

output_root: attempts/attempt5/studies/study01/artifacts
