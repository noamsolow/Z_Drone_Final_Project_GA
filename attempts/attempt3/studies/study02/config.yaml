study_name: study02_stacked_big_random_forest

sources:
  attempt1_features_csv: attempts/attempt1/artifacts/features/features.csv
  study06_fused_features_csv: attempts/attempt2/studies/study_06_all_images_midpoint_random_forest/artifacts/fused_features/depth_only_feature_table.csv
  study06_metrics_csv: attempts/attempt2/studies/study_06_all_images_midpoint_random_forest/artifacts/reports/subset_random_forest_metrics.csv

split:
  seed: 20260520
  holdout_fraction: 0.15
  num_folds: 5

lower_model:
  selected_model_name: random_forest_top_24
  inner_num_folds: 5
  inner_seed: 20260520
  score_feature_name: depth_lower_model_prediction
  random_forest:
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 2
    max_features: sqrt
    random_state: 20260518

upper_random_forest:
  candidate_configs:
    - name: rf_shallow
      n_estimators: 300
      max_depth: 10
      min_samples_leaf: 5
      max_features: sqrt
      random_state: 20260520
    - name: rf_medium
      n_estimators: 300
      max_depth: 16
      min_samples_leaf: 3
      max_features: sqrt
      random_state: 20260520
    - name: rf_deep
      n_estimators: 300
      max_depth: 24
      min_samples_leaf: 2
      max_features: sqrt
      random_state: 20260520
    - name: rf_unbounded
      n_estimators: 300
      max_depth: null
      min_samples_leaf: 2
      max_features: sqrt
      random_state: 20260520
  model_candidate_names:
    raw_depth_only_rf:
      - rf_shallow
      - rf_medium
      - rf_deep
      - rf_unbounded
    geometry_metadata_rf:
      - rf_shallow
      - rf_medium
      - rf_deep
      - rf_unbounded
    raw_depth_geometry_metadata_rf:
      - rf_shallow
      - rf_medium
      - rf_deep
      - rf_unbounded
    small_rf_depth_only_rf:
      - rf_shallow
      - rf_medium
      - rf_deep
      - rf_unbounded
    stacked_rf_depth_geometry_metadata_rf:
      - rf_shallow
      - rf_medium
      - rf_deep
      - rf_unbounded

modeling:
  model_names:
    - raw_depth_only_rf
    - geometry_metadata_rf
    - raw_depth_geometry_metadata_rf
    - small_rf_depth_only_rf
    - stacked_rf_depth_geometry_metadata_rf

output_root: attempts/attempt3/studies/study02/artifacts
