study_name: study02_bbox_scale_domain_randomization

sources:
  synthetic_feature_table_csv: attempts/attempt4/studies/study01/artifacts/features/noisy_expanded_feature_table.csv
  synthetic_split_json: attempts/attempt4/studies/study01/artifacts/splits/test_split.json
  real_feature_table_csv: attempts/attempt5/studies/study02/artifacts/features/nenrus_feature_table.csv

features:
  raw_depth_feature_name: bbox_only__inner50_median__object_depth
  categorical_feature_names:
    - weather
    - time_of_day

model:
  rf:
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 2
    max_features: sqrt
    random_state: 20260520
    n_jobs: 1
  xgb:
    n_estimators: 350
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 2.0
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    reg_alpha: 0.0
    random_state: 20260520
    n_jobs: 1
    tree_method: hist
    verbosity: 0
  blend:
    rf_weight: 0.44
    xgb_weight: 0.56

variants:
  - name: baseline_full_geometry
    description: Full raw-depth + geometry + metadata baseline.
    depth_mode: raw
    geometry_mode: full
    scale_randomization:
      mode: none

  - name: reduced_geometry
    description: Compact geometry baseline from study01.
    depth_mode: raw
    geometry_mode: compact
    scale_randomization:
      mode: none

  - name: scale_uniform_060_140_full_geometry
    description: Broad but moderate physical-size scale randomization.
    depth_mode: raw
    geometry_mode: full
    scale_randomization:
      mode: uniform
      min_scale: 0.60
      max_scale: 1.40

  - name: scale_uniform_040_140_full_geometry
    description: Wider physical-size scale randomization.
    depth_mode: raw
    geometry_mode: full
    scale_randomization:
      mode: uniform
      min_scale: 0.40
      max_scale: 1.40

  - name: scale_uniform_040_140_reduced_geometry
    description: Wider scale randomization with compact geometry.
    depth_mode: raw
    geometry_mode: compact
    scale_randomization:
      mode: uniform
      min_scale: 0.40
      max_scale: 1.40

  - name: scale_lognormal_full_geometry
    description: Smooth scale randomization around 1.0 with heavy tails.
    depth_mode: raw
    geometry_mode: full
    scale_randomization:
      mode: lognormal
      sigma: 0.35
      min_scale: 0.35
      max_scale: 1.70

  - name: scale_lognormal_reduced_geometry
    description: Lognormal scale randomization with compact geometry.
    depth_mode: raw
    geometry_mode: compact
    scale_randomization:
      mode: lognormal
      sigma: 0.35
      min_scale: 0.35
      max_scale: 1.70

  - name: raw_depth_only
    description: Raw relative-depth-only lower bound.
    depth_mode: raw
    geometry_mode: none
    scale_randomization:
      mode: none

output_root: attempts/attempt6/studies/study02/artifacts
