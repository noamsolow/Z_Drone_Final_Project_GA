study_name: study01_geometry_regularized_synthetic_to_real

sources:
  synthetic_feature_table_csv: attempts/attempt4/studies/study01/artifacts/features/noisy_expanded_feature_table.csv
  synthetic_split_json: attempts/attempt4/studies/study01/artifacts/splits/test_split.json
  real_feature_table_csv: attempts/attempt5/studies/study02/artifacts/features/nenrus_feature_table.csv

features:
  raw_depth_feature_name: bbox_only__inner50_median__object_depth
  categorical_feature_names:
    - weather
    - time_of_day

model:
  rf:
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 2
    max_features: sqrt
    random_state: 20260520
    n_jobs: 1
  xgb:
    n_estimators: 350
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 2.0
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    reg_alpha: 0.0
    random_state: 20260520
    n_jobs: 1
    tree_method: hist
    verbosity: 0
  blend:
    rf_weight: 0.44
    xgb_weight: 0.56

variants:
  - name: baseline_full_geometry
    description: Full raw-depth + geometry + metadata baseline.
    depth_mode: raw
    geometry_mode: full
    train_corruption:
      dropout_probability: 0.0
      noise_scale_std: 0.0

  - name: geometry_dropout_030
    description: Replace random geometry values with train medians during synthetic training.
    depth_mode: raw
    geometry_mode: full
    train_corruption:
      dropout_probability: 0.30
      noise_scale_std: 0.0

  - name: geometry_dropout_060
    description: Stronger geometry dropout during synthetic training.
    depth_mode: raw
    geometry_mode: full
    train_corruption:
      dropout_probability: 0.60
      noise_scale_std: 0.0

  - name: geometry_noise_020
    description: Multiplicative geometry noise during synthetic training.
    depth_mode: raw
    geometry_mode: full
    train_corruption:
      dropout_probability: 0.0
      noise_scale_std: 0.20

  - name: geometry_dropout_030_noise_020
    description: Combined geometry dropout and geometry noise.
    depth_mode: raw
    geometry_mode: full
    train_corruption:
      dropout_probability: 0.30
      noise_scale_std: 0.20

  - name: reduced_geometry
    description: Use compact geometry to reduce bbox-size dominance.
    depth_mode: raw
    geometry_mode: compact
    train_corruption:
      dropout_probability: 0.0
      noise_scale_std: 0.0

  - name: raw_depth_only
    description: Raw relative-depth-only stress test with no geometry.
    depth_mode: raw
    geometry_mode: none
    train_corruption:
      dropout_probability: 0.0
      noise_scale_std: 0.0

output_root: attempts/attempt6/studies/study01/artifacts
