study_name: attempt9_study02_depth_pro_study06_fused_features
dataset_root: C:\Users\depthlev\Desktop\droneImages\dataset
strict: true
max_samples: null

sources:
  source_fused_features_csv: attempts/attempt2/studies/study_06_all_images_midpoint_random_forest/artifacts/fused_features/depth_only_feature_table.csv

depth_model:
  kind: depth_pro
  checkpoint_path: checkpoints/depth_pro.pt
  device: cuda

study:
  progress_log_every_rows: 25
  checkpoint_every_rows: 1
  resume_from_partial: true
  stop_on_missing_source: false
  excluded_path_fragments:
    - depth_20/clear_sky/10AM
    - depth_20/light_rain/10AM
    - depth_30/clear_sky/10AM
    - depth_30/light_rain/10AM
  inner_bbox_scale: 0.5
  surrounding_bbox_scale: 1.8
  context_windows:
    - name: full_image
      scale: null
    - name: bbox_expand_4x
      scale: 4.0
    - name: bbox_expand_2x
      scale: 2.0
    - name: bbox_expand_1_5x
      scale: 1.5
    - name: bbox_only
      scale: 1.0
  aggregation_methods:
    - inner50_median
    - bbox_mean
    - bbox_midpoint
  score_fields:
    - object_depth

output_root: attempts/attempt9/study02/artifacts
